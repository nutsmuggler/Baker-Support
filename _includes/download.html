<!-- Download -->
<section class="section split split--download" id="download">
  <div>
    <span class="kicker">Download</span>
    <h2 class="title title--sm" style="max-width: 22ch">Knead for iPhone and iPad</h2>
    <p class="lead lead--tight" style="max-width: 46ch; margin-bottom: 30px">Requires iOS or iPadOS 17 and later. Your recipes and Diary live on your device and sync privately through your own iCloud account — we never see them.</p>
    <div class="store-row">
      <a class="store-btn" href="#appstore">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13m0 0 5-5m-5 5-5-5M4 20h16"></path></svg>
        <span>
          <span class="store-kicker">Download on the</span>
          <span class="store-name">App Store</span>
        </span>
      </a>
      <span class="fine" style="max-width: 20ch">Free to try · subscribe to unlock scheduling</span>
    </div>
  </div>
  <figure class="device-pair">
    <div class="device device--phone-sm" style="--device-width: min(182px, 35vw); --frame-radius: 35px">
      <img class="screen washed" src="assets/iphone-recipes.png" alt="The Knead recipe library on iPhone">
    </div>
    <div class="device device--phone-xs" style="--device-width: min(158px, 30vw); --frame-radius: 30px">
      <img class="screen washed" src="assets/iphone-detail.png" alt="A recipe detail screen in Knead">
    </div>
  </figure>
</section>
