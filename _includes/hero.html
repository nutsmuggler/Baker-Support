<!-- Hero -->
<section class="section section--first hero-band">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="blob" aria-hidden="true"></div>
  <div class="shell split split--hero">
    <div>
      <span class="kicker">Knead — a baking companion for iPhone &amp; iPad</span>
      <h1 class="display">
        Bread takes time.<br/>
        <span class="app-name">Knead</span> keeps track of it.
      </h1>
      <div class="row row--cta">
        <a class="btn btn-primary btn-pill" href="#download">Download for iOS</a>
        <a class="btn btn-secondary btn-pill" href="#help">Ask us something</a>
      </div>
    </div>
    <figure class="device-pair">
      <div class="device device--phone-xs">
        <img class="screen washed" src="assets/iphone-recipes.png" alt="Knead recipe library on iPhone">
      </div>
      <div class="device device--phone-sm">
        <img class="screen washed" src="assets/iphone-schedule.png" alt="A baking schedule laid out in Knead on iPhone">
      </div>
    </figure>
  </div>
</section>
